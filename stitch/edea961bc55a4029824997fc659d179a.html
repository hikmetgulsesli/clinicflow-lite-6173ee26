<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Patient Editor - ClinicFlow Lite</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "on-error": "#ffffff",
                    "on-tertiary-fixed": "#360f00",
                    "primary": "#003178",
                    "surface-container": "#ededf5",
                    "inverse-surface": "#2e3036",
                    "surface-bright": "#faf8ff",
                    "on-surface": "#1a1b21",
                    "surface-tint": "#2b5bb5",
                    "surface-container-highest": "#e2e2ea",
                    "secondary-fixed-dim": "#88d982",
                    "background": "#faf8ff",
                    "on-secondary-fixed-variant": "#005312",
                    "primary-fixed-dim": "#b0c6ff",
                    "inverse-primary": "#b0c6ff",
                    "on-primary": "#ffffff",
                    "on-secondary": "#ffffff",
                    "secondary-container": "#a0f399",
                    "on-surface-variant": "#434652",
                    "on-primary-fixed": "#001945",
                    "tertiary-fixed-dim": "#ffb596",
                    "secondary-fixed": "#a3f69c",
                    "on-primary-fixed-variant": "#00429c",
                    "primary-container": "#0d47a1",
                    "secondary": "#1b6d24",
                    "surface-dim": "#d9d9e1",
                    "tertiary-container": "#853100",
                    "tertiary-fixed": "#ffdbcd",
                    "tertiary": "#602100",
                    "on-tertiary": "#ffffff",
                    "surface-container-lowest": "#ffffff",
                    "on-tertiary-fixed-variant": "#7d2d00",
                    "error": "#ba1a1a",
                    "surface-container-high": "#e8e7f0",
                    "primary-fixed": "#d9e2ff",
                    "surface-container-low": "#f3f3fb",
                    "on-background": "#1a1b21",
                    "on-primary-container": "#a1bbff",
                    "on-error-container": "#93000a",
                    "on-secondary-container": "#217128",
                    "inverse-on-surface": "#f0f0f8",
                    "surface": "#faf8ff",
                    "outline": "#737783",
                    "error-container": "#ffdad6",
                    "on-secondary-fixed": "#002204",
                    "on-tertiary-container": "#ffa781",
                    "outline-variant": "#c3c6d4",
                    "surface-variant": "#e2e2ea"
            },
            "borderRadius": {
                    "DEFAULT": "0.125rem",
                    "lg": "0.25rem",
                    "xl": "0.5rem",
                    "full": "0.75rem"
            },
            "spacing": {
                    "md": "16px",
                    "lg": "24px",
                    "sm": "8px",
                    "base": "4px",
                    "margin": "16px",
                    "xl": "32px",
                    "xs": "4px",
                    "gutter": "12px"
            },
            "fontFamily": {
                    "body-lg": ["Inter"],
                    "label-sm": ["Inter"],
                    "headline-lg": ["Inter"],
                    "data-mono": ["Inter"],
                    "label-md": ["Inter"],
                    "headline-md": ["Inter"],
                    "body-md": ["Inter"],
                    "body-sm": ["Inter"],
                    "headline-sm": ["Inter"]
            },
            "fontSize": {
                    "body-lg": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],
                    "label-sm": ["11px", {"lineHeight": "14px", "fontWeight": "500"}],
                    "headline-lg": ["24px", {"lineHeight": "32px", "letterSpacing": "-0.02em", "fontWeight": "600"}],
                    "data-mono": ["14px", {"lineHeight": "20px", "letterSpacing": "-0.01em", "fontWeight": "500"}],
                    "label-md": ["12px", {"lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "600"}],
                    "headline-md": ["20px", {"lineHeight": "28px", "letterSpacing": "-0.01em", "fontWeight": "600"}],
                    "body-md": ["14px", {"lineHeight": "20px", "fontWeight": "400"}],
                    "body-sm": ["13px", {"lineHeight": "18px", "fontWeight": "400"}],
                    "headline-sm": ["16px", {"lineHeight": "24px", "fontWeight": "600"}]
            }
          }
        }
      }
    </script>
<style>
        body {
            background-color: theme('colors.background');
            color: theme('colors.on-background');
        }
    </style>
</head>
<body class="antialiased min-h-screen flex flex-col">
<!-- Top Navigation Bar (Suppressed due to linear/task-focused intent) -->
<!-- Side Navigation Bar (Suppressed due to linear/task-focused intent) -->
<main class="flex-grow flex items-center justify-center p-md">
<div class="w-full max-w-2xl bg-surface-container-lowest border border-surface-variant rounded-xl shadow-sm overflow-hidden">
<!-- Header -->
<div class="px-lg py-md border-b border-surface-variant bg-surface flex justify-between items-center">
<div class="flex items-center gap-sm">
<button class="text-on-surface-variant hover:bg-surface-container-low p-sm rounded-full transition-colors flex items-center justify-center">
<span class="material-symbols-outlined text-[20px]">arrow_back</span>
</button>
<h1 class="font-headline-md text-headline-md text-on-surface">Edit Patient Record</h1>
</div>
</div>
<!-- Form Content -->
<div class="p-lg">
<!-- Alert Banner -->
<div class="mb-lg bg-error-container border-l-2 border-error p-sm rounded-r-DEFAULT flex items-start gap-sm">
<span class="material-symbols-outlined text-error text-[18px] mt-xs">error</span>
<div>
<p class="font-label-sm text-label-sm text-on-error-container uppercase tracking-wider mb-xs">Required Action</p>
<p class="font-body-sm text-body-sm text-on-surface">Please complete all required fields marked with an asterisk (*).</p>
</div>
</div>
<form class="space-y-lg">
<!-- Section: Personal Details -->
<div>
<h2 class="font-label-md text-label-md text-on-surface-variant uppercase tracking-wider mb-md pb-xs border-b border-surface-variant">Personal Details</h2>
<div class="grid grid-cols-1 md:grid-cols-2 gap-gutter">
<!-- Full Name -->
<div class="col-span-1 md:col-span-2">
<label class="block font-label-sm text-label-sm text-on-surface mb-base" for="fullName">Full Name *</label>
<input class="w-full bg-surface-container-lowest border border-error rounded-DEFAULT px-sm py-[6px] font-body-md text-body-md text-on-surface focus:outline-none focus:ring-1 focus:ring-error focus:border-error transition-colors" id="fullName" type="text" value="Sarah Jenkins"/>
<p class="font-body-sm text-body-sm text-error mt-base flex items-center gap-xs">
<span class="material-symbols-outlined text-[14px]">warning</span>
                                    Name is required for billing.
                                </p>
</div>
<!-- Date of Birth -->
<div>
<label class="block font-label-sm text-label-sm text-on-surface mb-base" for="dob">Date of Birth *</label>
<input class="w-full bg-surface-container-lowest border border-outline-variant rounded-DEFAULT px-sm py-[6px] font-body-md text-body-md text-on-surface focus:outline-none focus:ring-1 focus:ring-primary focus:border-primary transition-colors" id="dob" type="date" value="1985-04-12"/>
</div>
<!-- Gender -->
<div>
<label class="block font-label-sm text-label-sm text-on-surface mb-base" for="gender">Gender</label>
<select class="w-full bg-surface-container-lowest border border-outline-variant rounded-DEFAULT px-sm py-[6px] font-body-md text-body-md text-on-surface focus:outline-none focus:ring-1 focus:ring-primary focus:border-primary transition-colors appearance-none" id="gender">
<option>Female</option>
<option>Male</option>
<option>Non-binary</option>
<option>Other</option>
</select>
</div>
</div>
</div>
<!-- Section: Contact Information -->
<div>
<h2 class="font-label-md text-label-md text-on-surface-variant uppercase tracking-wider mb-md pb-xs border-b border-surface-variant">Contact Information</h2>
<div class="grid grid-cols-1 md:grid-cols-2 gap-gutter">
<!-- Phone -->
<div>
<label class="block font-label-sm text-label-sm text-on-surface mb-base" for="phone">Phone Number *</label>
<input class="w-full bg-surface-container-lowest border border-outline-variant rounded-DEFAULT px-sm py-[6px] font-body-md text-body-md text-on-surface focus:outline-none focus:ring-1 focus:ring-primary focus:border-primary transition-colors" id="phone" type="tel" value="(555) 123-4567"/>
</div>
<!-- Email -->
<div>
<label class="block font-label-sm text-label-sm text-on-surface mb-base" for="email">Email Address</label>
<input class="w-full bg-surface-container-lowest border border-outline-variant rounded-DEFAULT px-sm py-[6px] font-body-md text-body-md text-on-surface focus:outline-none focus:ring-1 focus:ring-primary focus:border-primary transition-colors" id="email" type="email" value="sarah.j@example.com"/>
</div>
</div>
</div>
<!-- Section: Visit Details -->
<div>
<h2 class="font-label-md text-label-md text-on-surface-variant uppercase tracking-wider mb-md pb-xs border-b border-surface-variant">Visit Details</h2>
<div class="grid grid-cols-1 gap-gutter">
<!-- Reason for Visit -->
<div>
<label class="block font-label-sm text-label-sm text-on-surface mb-base" for="reason">Primary Reason for Visit *</label>
<textarea class="w-full bg-surface-container-lowest border border-outline-variant rounded-DEFAULT px-sm py-sm font-body-md text-body-md text-on-surface focus:outline-none focus:ring-1 focus:ring-primary focus:border-primary transition-colors resize-none" id="reason" rows="3">Annual physical and consultation regarding mild joint pain.</textarea>
</div>
<!-- Insurance Provider -->
<div class="md:w-1/2">
<label class="block font-label-sm text-label-sm text-on-surface mb-base" for="insurance">Insurance Provider</label>
<input class="w-full bg-surface-container-lowest border border-outline-variant rounded-DEFAULT px-sm py-[6px] font-body-md text-body-md text-on-surface focus:outline-none focus:ring-1 focus:ring-primary focus:border-primary transition-colors" id="insurance" type="text" value="BlueCross Health"/>
</div>
</div>
</div>
</form>
</div>
<!-- Footer Actions -->
<div class="px-lg py-md border-t border-surface-variant bg-surface flex justify-end gap-sm">
<button class="px-md py-sm rounded-DEFAULT border border-primary text-primary font-label-md text-label-md hover:bg-surface-container-low transition-colors bg-transparent" type="button">
                    Cancel
                </button>
<button class="px-md py-sm rounded-DEFAULT bg-primary text-on-primary font-label-md text-label-md hover:bg-primary-container hover:text-on-primary-container transition-colors shadow-sm" type="button">
                    Save Changes
                </button>
</div>
</div>
</main>
</body></html>
